<!doctype html>
<html lang="en">
  <head>
    <title>FOXY 🦊</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="modules/MMM-Remote-Control/manifest.json" />

    <!-- Theme colors for PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="msapplication-config" content="none" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Foxy 🦊" />

    <!-- Modern SVG favicon with dark mode support -->
    <link
      rel="icon"
      href="modules/MMM-Remote-Control/img/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/roboto.css" />
    <link rel="stylesheet" href="css/font-awesome.css" />
    <link
      rel="stylesheet"
      href="modules/MMM-Remote-Control/remote/remote.css"
    />
    <link
      rel="apple-touch-icon"
      href="modules/MMM-Remote-Control/img/apple-touch-icon.png"
    />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>

  <body>
    <div class="container normal">
      <div id="module_1_MMM-Remote-Control" class="app">
        <header class="header">
          <div
            id="back-button"
            class="hidden button"
            role="button"
            aria-label="%%TRANSLATE:BACK%%"
            tabindex="0"
          >
            <span class="fa fa-fw fa-angle-left" aria-hidden="true"></span>
          </div>
          <span class="header-title">FOXY 🦊</span>
          <div
            id="lock-button"
            class="button lock-button"
            role="button"
            aria-label="Lock"
            tabindex="0"
            title="Lock"
          >
            <span class="fa fa-fw fa-lock" aria-hidden="true"></span>
          </div>
        </header>
        <main class="main-content">
          <!-- Navigation and menu content rendered dynamically after translations load -->
        </main>
        <div id="load-error">
          <span
            class="fa fa-fw fa-exclamation-circle"
            aria-hidden="true"
          ></span>
          <span class="text">%%TRANSLATE:LOAD_ERROR%%</span>
          <a href="https://github.com/jopyth/MMM-Remote-Control/issues"
            >%%TRANSLATE:ISSUE_LINK%%</a
          >
        </div>
        <div id="result-overlay" class="overlay hidden"></div>
        <div id="result" class="result hidden">
          <div id="close-result">
            <span class="fa fa-times-circle delete-button"></span>
          </div>
          <div id="result-contents">
            <!-- content is inserted here -->
          </div>
        </div>
        <div id="popup-container" class="popup hidden">
          <div id="close-popup">
            <span class="fa fa-times-circle delete-button"></span>
          </div>
          <div id="popup-contents" class="popup-contents">
            <!-- content is inserted here -->
          </div>
        </div>
        <div id="success-popup" class="success-popup hidden">
          <span class="fa fa-fw fa-check-circle"></span>
          <span class="text">%%TRANSLATE:DONE%%</span>
        </div>
        <div id="pin-overlay" class="pin-overlay">
          <div class="pin-card" role="dialog" aria-modal="true" aria-label="Locked">
            <div class="pin-logo">🦊</div>
            <div class="pin-title">FOXY</div>
            <div class="pin-subtitle">Enter PIN</div>
            <div id="pin-dots" class="pin-dots">
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
              <span class="pin-dot"></span>
            </div>
            <div class="pin-keypad">
              <button type="button" class="pin-key" data-key="1">1</button>
              <button type="button" class="pin-key" data-key="2">2</button>
              <button type="button" class="pin-key" data-key="3">3</button>
              <button type="button" class="pin-key" data-key="4">4</button>
              <button type="button" class="pin-key" data-key="5">5</button>
              <button type="button" class="pin-key" data-key="6">6</button>
              <button type="button" class="pin-key" data-key="7">7</button>
              <button type="button" class="pin-key" data-key="8">8</button>
              <button type="button" class="pin-key" data-key="9">9</button>
              <button type="button" class="pin-key pin-key-empty" tabindex="-1" aria-hidden="true"></button>
              <button type="button" class="pin-key" data-key="0">0</button>
              <button type="button" class="pin-key pin-key-back" data-key="back" aria-label="Delete">
                <span class="fa fa-fw fa-delete" aria-hidden="true"></span>
              </button>
            </div>
            <div id="pin-error" class="pin-error hidden">Invalid PIN, try again</div>
          </div>
        </div>
      </div>
    </div>
    <script src="%%CONFIG_PATH%%"></script>
    <script src="socket.io/socket.io.js"></script>
    <script type="importmap">
      {
        "imports": {
          "marked": "./modules/MMM-Remote-Control/node_modules/marked/lib/marked.esm.js",
          "dompurify": "./modules/MMM-Remote-Control/node_modules/dompurify/dist/purify.es.mjs"
        }
      }
    </script>
    <script type="module">
      // TODO: Backward-compatibility shim for pre-ESM MagicMirror socketclient.js.
      // Remove in 2027 when old core versions are no longer supported.
      const loadLegacySocketClient = async () => {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "js/socketclient.js";
          script.async = false;
          script.onload = resolve;
          script.onerror = reject;
          document.head.append(script);
        });

        if (!globalThis.MMSocket && typeof MMSocket !== "undefined") {
          globalThis.MMSocket = MMSocket;
        }
      };

      try {
        const socketClientModule = await import("./js/socketclient.js");
        if (socketClientModule?.MMSocket) {
          globalThis.MMSocket = socketClientModule.MMSocket;
        }
      } catch {
        await loadLegacySocketClient();
      }

      if (!globalThis.MMSocket) {
        await loadLegacySocketClient();
      }

      await import("./modules/MMM-Remote-Control/remote/remote-menu.mjs");
    </script>

    <!-- Tombol GPS Smart Mirror BSD: kirim posisi HP ke cermin sekali klik -->
    <script src="./modules/MMM-TrafficMap/public/gps-button.js"></script>
  </body>
</html>
